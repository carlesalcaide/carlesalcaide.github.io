<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SardanaDelivery</title>
  <meta name="description" content="Repartidor de sardanes: estil empordanès i selvatà.">
  <meta name="theme-color" content="#0B1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sardana">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icona-192.png">
  <style>
    :root {
      --bg: #0B1120; --surface: #151E31; --surface-2: #1E293B; --border: #2A3650;
      --amber: #F59E0B; --cyan: #38BDF8; --text: #F1F5F9; --muted: #8090A8; --error: #F87171;
      --ok-bg: #14532D; --ok: #86EFAC; --ko-bg: #7F1D1D; --ko: #FCA5A5;
      --radi: 18px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      -webkit-font-smoothing: antialiased;
      padding: max(18px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { color: var(--amber); font-size: 1.7rem; margin: 0; letter-spacing: -0.01em; }
    .sub { color: var(--muted); margin: 2px 0 16px; font-size: 0.9rem; }
    .seccio { color: var(--muted); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
              text-transform: uppercase; margin: 14px 0 6px; }
    .caixa { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 16px 18px; }
    .caixa + .caixa, details + .caixa { margin-top: 14px; }

    /* Selector en pastilla */
    .seg { display: flex; gap: 4px; background: var(--surface-2); border-radius: 999px; padding: 4px; }
    .seg button {
      flex: 1; border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 700;
      font-size: 0.85rem; padding: 9px 4px; border-radius: 999px; cursor: pointer;
    }
    .seg button.actiu { background: var(--amber); color: var(--bg); }
    .seg.pagines { margin-bottom: 16px; }
    .seg.pagines button.actiu { background: var(--border); color: var(--text); }

    /* Entrades */
    .entrades { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .entrades.una { grid-template-columns: 1fr; }
    .entrada label { display: block; color: var(--muted); font-size: 0.8rem; margin-bottom: 5px; }
    .camp { display: flex; align-items: center; background: var(--surface-2); border-radius: 16px;
            border: 1px solid var(--surface-2); }
    .camp:focus-within { border-color: var(--amber); }
    .camp input {
      flex: 1; min-width: 0; width: 100%; background: transparent; border: 0; color: var(--text);
      font: inherit; font-size: 1.7rem; font-weight: 800; text-align: center; padding: 10px 0; outline: none;
    }
    .camp button { background: none; border: 0; color: var(--muted); font-size: 1.4rem; font-weight: 700;
                   width: 44px; height: 52px; cursor: pointer; }
    .camp button:active { color: var(--amber); }

    /* Desplegable */
    details { margin-top: 14px; }
    summary {
      list-style: none; display: flex; align-items: center; gap: 8px; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 13px 16px;
      font-weight: 700; font-size: 0.9rem;
    }
    summary::-webkit-details-marker { display: none; }
    summary .resum { margin-left: auto; color: var(--muted); font-weight: 500; font-size: 0.78rem; text-align: right; }
    summary .fletxa { color: var(--amber); transition: transform .15s; }
    details[open] summary .fletxa { transform: rotate(180deg); }
    details .caixa { margin-top: 8px; }
    details .caixa > .seccio:first-child { margin-top: 0; }

    /* Resultats */
    .files { display: grid; grid-template-columns: auto auto 1fr; align-items: center; column-gap: 10px; row-gap: 7px; }
    .punt { width: 8px; height: 8px; border-radius: 50%; }
    .nom { color: var(--muted); font-size: 0.82rem; white-space: nowrap; }
    .final { font-weight: 800; font-size: clamp(0.85rem, 4.2vw, 1.12rem); overflow-wrap: anywhere; }
    .curts { color: var(--cyan); } .curts.punt { background: var(--cyan); }
    .llargs { color: var(--amber); } .llargs.punt { background: var(--amber); }
    .una-tirada { text-align: center; padding: 26px 18px; }
    .una-tirada .etiqueta { color: var(--muted); font-size: 0.9rem; }
    .una-tirada .final { font-size: clamp(1.2rem, 7vw, 1.9rem); margin-top: 6px; }
    .error { color: var(--error); font-weight: 700; }

    /* Normes */
    .normes h2 { color: var(--amber); font-size: 0.72rem; letter-spacing: 0.06em; margin: 18px 0 6px; }
    .normes h2:first-child { margin-top: 0; }
    .normes p { margin: 0 0 10px; line-height: 1.5; font-size: 0.93rem; }

    /* Pràctica */
    .pregunta { font-weight: 700; line-height: 1.4; margin: 6px 0 12px; }
    .opcio {
      display: block; width: 100%; text-align: left; border: 0; border-radius: 14px; padding: 12px 14px;
      margin: 6px 0; background: var(--surface-2); color: var(--text); font: inherit; font-weight: 700; cursor: pointer;
    }
    .opcio.ok { background: var(--ok-bg); color: var(--ok); }
    .opcio.ko { background: var(--ko-bg); color: var(--ko); }
    .explicacio { color: var(--muted); line-height: 1.45; font-size: 0.9rem; margin-top: 10px; }
    .peu-ex { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; }
    .peu-ex span { color: var(--muted); font-size: 0.8rem; }
    .enllac { background: none; border: 0; color: var(--amber); font: inherit; font-weight: 700; cursor: pointer; }
    .fila-cmp { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
    .fila-cmp input {
      width: 76px; background: var(--surface-2); border: 1px solid var(--surface-2); border-radius: 14px; color: var(--text);
      font: inherit; font-weight: 800; font-size: 1.2rem; text-align: center; padding: 9px 0; outline: none;
    }
    .fila-cmp input:focus { border-color: var(--amber); }
    .fila-cmp .seg { flex: 1; min-width: 0; }
    .fila-cmp .seg button { font-size: 0.75rem; white-space: nowrap; padding: 9px 2px; }
    .ok-text { color: var(--ok); } .ko-text { color: var(--ko); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>SardanaDelivery</h1>
  <p class="sub">Repartidor de sardanes</p>
  <div class="seg pagines" id="pagines"></div>

  <!-- Repartidor -->
  <section id="p-Repartidor">
    <div class="entrades" id="in-sardana">
      <div class="entrada"><label for="curts">Curts</label><div class="camp" data-camp="curts"></div></div>
      <div class="entrada"><label for="llargs">Llargs</label><div class="camp" data-camp="llargs"></div></div>
    </div>
    <div class="entrades una" id="in-tirada" hidden>
      <div class="entrada"><label for="n">Compassos</label><div class="camp" data-camp="n"></div></div>
    </div>

    <details id="opcions">
      <summary>Més opcions <span class="resum" id="resum"></span><span class="fletxa">▾</span></summary>
      <div class="caixa">
        <div class="seccio">Què vols repartir</div><div class="seg" id="abast"></div>
        <div id="op-sardana">
          <div class="seccio">Tirades</div><div class="seg" id="mida"></div>
          <div class="seccio">Estil</div><div class="seg" id="estil"></div>
          <div class="seccio">Primera i segona de cada tipus</div><div class="seg" id="mode"></div>
        </div>
        <div id="op-tirada" hidden>
          <div class="seccio">Tirada</div><div class="seg" id="tipus"></div>
          <div id="op-peu"><div class="seccio">Peu d'inici</div><div class="seg" id="peu"></div></div>
        </div>
      </div>
    </details>

    <div class="caixa" id="res-sardana"><div class="files" id="files"></div></div>
    <div class="caixa una-tirada" id="res-tirada" hidden>
      <div class="etiqueta" id="una-etiqueta"></div>
      <div class="final" id="una-final"></div>
    </div>
  </section>

  <!-- Normes -->
  <section id="p-Normes" hidden><div class="caixa normes" id="normes"></div></section>

  <!-- Pràctica -->
  <section id="p-Pràctica" hidden>
    <div class="caixa">
      <div class="seccio" style="margin-top:0;color:var(--amber)">Exercici</div>
      <div class="pregunta" id="ex-pregunta"></div>
      <div id="ex-opcions"></div>
      <div class="explicacio" id="ex-explicacio"></div>
      <div class="peu-ex"><span id="ex-punts"></span><button class="enllac" id="ex-seguent">Següent ›</button></div>
    </div>
    <div class="caixa">
      <div class="seccio" style="margin-top:0;color:var(--amber)">M'he descomptat?</div>
      <div class="explicacio" style="margin-top:0">Digues el número que comptes i on ets del pas. L'app et diu si encaixa (no serveix per a la 2a tirada doblada).</div>
      <div class="seg" id="cmp-tipus" style="margin-top:10px"></div>
      <div class="fila-cmp"><input id="cmp-n" type="number" inputmode="numeric" min="1" value="40"><div class="seg" id="cmp-moment"></div></div>
      <div class="explicacio" id="cmp-res"></div>
    </div>
  </section>
</main>
<script src="dades.js"></script>
<script src="app.js"></script>
</body>
</html>
